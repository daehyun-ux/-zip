/* Layout: one phone-width column; each step is a full-height screen with a sticky path bar and a bottom action bar. Single warm light look by choice. */
:root{
  --bg:#FFF8F2; --paper:#FFFFFF; --ink:#1B1A19; --sub:#6E6A64; --mute:#A39D94; --line:#F0E6DB;
  --acc:#FF5A36; --acc-soft:#FFE4D6; --acc-deep:#C2391B; --sun:#FFD84D; --sun-ink:#5C4500;
  --mint:#DDF1E4; --acc-mid:#FFB49F; --tint:#F6EFE7; --qm:#C9BFB2; --fade:rgba(255,248,242,0); --mint-ink:#1F5C38; --wrong:#E0412F;
  --f-sans:"Pretendard",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-cat="culture"]{--bg:#F6F4FF;--line:#E4DEF7;--sub:#66627A;--acc:#6A4DFF;--acc-soft:#E6E0FF;--acc-deep:#4528D4;--acc-mid:#B9A9FF;--tint:#EEEAFB;--qm:#B3A9D6;--fade:rgba(246,244,255,0)}
*{box-sizing:border-box}
html{background:var(--bg);transition:background-color .4s}
body{margin:0;background:var(--bg);transition:background .4s;color:var(--ink);font-family:var(--f-sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}
.app{max-width:440px;margin:0 auto;min-height:100%;position:relative}
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.screen.in{animation:slideIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.mono{font-family:var(--f-mono)}
.top{position:relative;z-index:20;display:flex;align-items:center;gap:8px;min-height:54px;margin:0 -4px;padding-top:env(safe-area-inset-top,0px)}
.back{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.path{font-family:var(--f-mono);font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.path b{color:var(--acc);font-weight:700}
/* 아래 버튼 영역: 화면에 고정하지 않고 내용과 함께 스크롤 → 사파리 주소창 뒤로 자연스럽게 흐려지며 지나감 */
.bottom{position:relative;margin-top:auto;padding:18px 0 calc(28px + env(safe-area-inset-bottom,0px));background:none}
#splash .bottom{background:none}
.btn{width:100%;min-height:56px;border-radius:16px;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--acc);color:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--acc) 22%,transparent)}
.btn.s{background:var(--paper);border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:5px 10px;border-radius:9px}
.tag.acc{background:var(--acc-soft);color:var(--acc-deep)}
.tag.ok{background:var(--mint);color:var(--mint-ink)}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:14px;background:var(--paper);color:var(--sub)}

/* splash */
#splash{text-align:center;align-items:center;overflow:hidden}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:1px;color:var(--acc);font-weight:700;margin-top:48px}
.stage{position:relative;width:min(340px,100%);height:320px;margin-top:6px}
.food-tile{position:absolute;z-index:6;width:74px;height:74px;border-radius:20px;background:var(--paper);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(160,80,40,.12);animation:bob 4s ease-in-out infinite;transition:transform .7s cubic-bezier(.2,.9,.3,1.2),opacity .5s}
.food-tile svg{width:58px;height:58px}
@keyframes bob{50%{translate:0 -6px}}
.fz{position:absolute;left:50%;top:84px;width:184px;height:148px;margin-left:-92px;padding:0;background:none;pointer-events:none}
.fz img{width:100%;height:100%;display:block;pointer-events:none}
.fz.back{z-index:1;pointer-events:auto;cursor:pointer}
.fz.back img{filter:drop-shadow(0 14px 20px rgba(255,60,20,.28))}
.fz.fpaper{z-index:2;transition:transform .8s cubic-bezier(.33,1.18,.5,1),translate .25s ease-out,rotate .25s ease-out}
.fz.front{z-index:5;transform-origin:50% 100%;transition:transform .85s cubic-bezier(.33,1.2,.5,1),translate .3s ease-out,rotate .3s ease-out}
.fz.front img{filter:drop-shadow(0 -2px 3px rgba(120,20,0,.18))}
.stage.flap .fz.front{transform:perspective(420px) rotateX(-38deg);transition:transform .6s cubic-bezier(.4,0,.2,1)}
.stage.flap .fz.fpaper{transform:translateY(-16px) rotate(-1.5deg)}
.fz.back,.fz.fpaper{transform-origin:50% 100%}
.pop{animation:fpop .8s cubic-bezier(.25,1.2,.45,1)}
@keyframes fpop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
.gulp{animation:fgulp .32s ease}
@keyframes fgulp{40%{transform:scaleX(1.08) scaleY(.92)}100%{transform:none}}
.screen.zoomin{animation:zoomIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes zoomIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.zip.shake{animation:shake .45s}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.tap-hint{position:absolute;left:50%;top:248px;transform:translateX(-50%);font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap}
h1.title{font-size:clamp(38px,11vw,46px);font-weight:900;letter-spacing:-2px;margin:4px 0 0;line-height:1.05}
h1.title em,.logo em{color:var(--acc);font-style:normal}
.lead{font-size:16px;color:var(--sub);margin:10px 0 0;line-height:1.6}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.resume{font-size:13px;color:var(--sub);margin-top:10px}

/* archive */
h2.h{font-size:28px;font-weight:900;letter-spacing:-.8px;margin:4px 0 0;text-wrap:balance}
.sub{font-size:14px;color:var(--sub);line-height:1.6}
.prog{background:var(--paper);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.prog .track{flex:1;height:8px;border-radius:4px;background:var(--tint);overflow:hidden}
.prog .fill{height:100%;background:var(--acc);border-radius:4px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.prog span{font-family:var(--f-mono);font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.folders{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.folder{background:var(--paper);border-radius:16px;border:1.5px solid transparent;overflow:hidden;transition:border-color .2s}
.folder.open{border-color:var(--acc)}
.folder.done .ficon{color:var(--acc)}
.fhead{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;min-height:60px}
.ficon{width:36px;height:28px;position:relative;flex-shrink:0;color:var(--acc-mid);transition:transform .25s}
.ficon::before{content:"";position:absolute;left:0;top:0;width:16px;height:8px;border-radius:3px 3px 0 0;background:currentColor}
.ficon::after{content:"";position:absolute;left:0;top:5px;width:36px;height:23px;border-radius:4px;background:currentColor}
.folder.open .ficon{transform:rotate(-6deg) scale(1.06)}
.yr{font-size:20px;font-weight:800;letter-spacing:-.3px;width:58px}
.yr{width:auto;min-width:58px;white-space:nowrap;font-variant-numeric:tabular-nums}
.peek{flex:1;display:flex;gap:4px}
.qm,.peek svg{width:30px;height:30px}
.qm{border-radius:8px;background:var(--tint);color:var(--qm);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.cnt{font-family:var(--f-mono);font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.folder.done .cnt{color:var(--acc);font-weight:700}
.files{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.folder.open .files{grid-template-rows:1fr}
.files>div{overflow:hidden}
.file{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px dashed var(--line);text-align:left;min-height:58px}
.file .fimg{width:40px;height:40px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--qm)}
.file .fimg svg{width:34px;height:34px}
.file .fname{flex:1;min-width:0}
.file .fname b{display:block;font-size:15px}

/* quiz */
.bar{display:flex;gap:6px;margin-top:4px}

.bar i.on{background:var(--acc)}
.hint{margin-top:20px;background:var(--acc);border-radius:24px;padding:24px 22px 26px;color:#fff;position:relative;overflow:hidden;min-height:220px}
.hint .big{position:absolute;right:-14px;bottom:-30px;font-size:160px;font-weight:900;color:rgba(255,255,255,.16);line-height:1;pointer-events:none}
.hint .no{font-family:var(--f-mono);font-size:13px;font-weight:700;opacity:.9}
.hint p.t{font-size:clamp(22px,6.4vw,26px);font-weight:900;line-height:1.42;letter-spacing:-.6px;margin:12px 0 0;position:relative;text-wrap:balance}

.prev-hints{display:flex;flex-direction:column;gap:6px;margin-top:10px}

.ask{font-size:15px;font-weight:800;margin:22px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt-fb{min-height:0;font-size:13px;line-height:1.5;color:var(--sub);margin-top:10px;padding:0 4px;opacity:0}.opt-fb b{color:var(--wrong);font-weight:800}.opt-fb span{display:block;margin-top:2px;font-weight:800;color:var(--ink,#1B1A18)}.opt-fb.show{opacity:1;animation:fbIn .35s ease}@keyframes fbIn{from{opacity:0;transform:translateY(-4px)}}
.opt{min-height:58px;border-radius:14px;background:var(--paper);border:1.5px solid var(--line);font-size:15px;font-weight:700;padding:8px;transition:transform .12s,border-color .2s,background .2s}
.opt:active{transform:scale(.96)}
.opt.wrong{border-color:var(--wrong);color:var(--wrong);background:#FFF0EC;text-decoration:line-through;animation:shake .4s}
.opt.right{border-color:var(--mint-ink);background:var(--mint);color:var(--mint-ink)}
.link{display:block;width:100%;text-align:center;font-size:14px;color:var(--sub);font-weight:800;padding:16px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:12px 18px;border-radius:14px;opacity:0;transition:all .3s;z-index:50;pointer-events:none;white-space:nowrap;display:none}
.toast.on{display:block}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* reveal */
#reveal{text-align:center;align-items:center;overflow:hidden}
.plate{position:relative;width:min(240px,64vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--acc-soft);margin:22px auto 18px;display:flex;align-items:center;justify-content:center}
.plate::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px dashed var(--acc-mid);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.plate svg{width:78%;height:78%;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.rname{font-size:38px;font-weight:900;letter-spacing:-1px;margin:0}
.rsub{font-size:15px;color:var(--sub);margin-top:2px}
.rdesc{font-size:14px;color:var(--sub);line-height:1.6;margin:12px auto 0;max-width:30ch}
.ate-q{font-size:16px;font-weight:800;margin-bottom:12px}
.ate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ate .btn{font-size:14px;min-height:54px;padding:0 4px}
.confetti{position:absolute;width:9px;height:12px;border-radius:2px;top:-20px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.stamp{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-10deg) scale(2);border:3px solid var(--acc);color:var(--acc);font-weight:900;font-size:22px;padding:8px 16px;border-radius:10px;background:rgba(255,248,242,.94);opacity:0;z-index:60;pointer-events:none;font-family:var(--f-mono)}

@keyframes stamp{20%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}}

/* record */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -4px 0;padding:2px 4px}

.panels{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:14px -20px 0;gap:0}
.panels::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;scroll-snap-align:start;padding:0 20px;min-width:0}

/* root: two category folders */

/* thermal receipt */

    stage.style.width="340px";stage.style.alignSelf="center";stage.style.flexShrink="0";
    stage.style.transformOrigin="50% 0";stage.style.scale=k<1?String(k):"";stage.style.marginBottom=k<1?`${-(1-k)*320}px`:""};
  fitStage();
  const mouth=()=>({x:stage.offsetWidth/2-37,y:zip.offsetTop+26-30});
  const toMouth=(t,extra="")=>{const m=mouth();return `translate(${m.x-t.offsetLeft}px,${m.y-t.offsetTop}px) ${extra}`};
  let busy=false;
  const intro=back&&!RM;
  if(intro){ /* 뒤로 나올 때: 종이 안에서 시작해 줌아웃 → 앞판이 닫히고 아이콘이 다시 튀어나옴 */
    const er=el.getBoundingClientRect(),pr=el.querySelector(".fz.fpaper").getBoundingClientRect();
    const hid=[...el.querySelectorAll(".tap-hint,.bottom")];hid.forEach(x=>{x.style.transition="none";x.style.opacity="0"});
    stage.classList.add("dive");
    T.forEach(t=>{t.style.animation="none";t.style.zIndex=3;t.style.transition="none";t.style.transform=toMouth(t,"scale(.15)");t.style.opacity="0"});
    el.style.transformOrigin=`${pr.left-er.left+pr.width/2}px ${pr.top-er.top+pr.height*.42}px`;
    el.style.transition="none";el.style.transform="scale(11)";el.style.willChange="transform";void el.offsetWidth;
    requestAnimationFrame(()=>{el.style.transition="transform .85s cubic-bezier(.15,.75,.3,1)";el.style.transform="none"});
    setTimeout(()=>{el.style.transition="";el.style.transform="";el.style.willChange="";el.style.transformOrigin=""},900);
    setTimeout(()=>{stage.classList.remove("dive");flap(true)},650);
    setTimeout(()=>hid.forEach(x=>{x.style.transition="opacity .5s";x.style.opacity=""}),1500);
  }
  if(!RM){
    const o=intro?450:0;
    T.forEach(t=>{t.style.animation="none";t.style.zIndex=3;t.style.transition="none";t.style.transform=toMouth(t,"scale(.15)");t.style.opacity="0";t.style.willChange="transform,opacity"});
    const start=()=>{if(busy)return;
      if(!intro)L.forEach(x=>x.classList.add("pop"));setTimeout(()=>{if(!busy)flap(true)},450+o);setTimeout(()=>{if(!busy)flap(false)},2000+o);
      requestAnimationFrame(()=>requestAnimationFrame(()=>T.forEach((t,i)=>{if(busy)return;const d=650+o+i*130;
        t.style.transition=`transform 1.1s cubic-bezier(.22,1.15,.4,1) ${d}ms, opacity .25s ${d}ms`;t.style.transform="none";t.style.opacity="1";
        setTimeout(()=>{if(!busy)t.style.zIndex=6},d+200);setTimeout(()=>{if(busy)return;t.style.transition="";t.style.animation="";t.style.willChange="";t.dataset.ready=1},d+1150)})))};
    /* 첫 화면: 폰트·폴더 이미지 해독이 끝난 뒤에 애니메이션 시작 (로딩 중 멈칫거림 방지, 최대 1.5초 대기) */
    if(intro)start();
    else{stage.style.visibility="hidden";
      const imgs=[...stage.querySelectorAll("img")].map(i=>i.decode?i.decode().catch(()=>{}):0);
      const loaded=document.readyState==="complete"?0:new Promise(r=>addEventListener("load",r,{once:true}));
      const idle=()=>new Promise(r=>window.requestIdleCallback?requestIdleCallback(r,{timeout:400}):setTimeout(r,120));
      const ready=Promise.all([document.fonts?document.fonts.ready:0,loaded,...imgs]).then(idle);
      Promise.race([ready,new Promise(r=>setTimeout(r,1500))]).then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{stage.style.visibility="";start()})))}
  }
  const go=()=>{
    if(busy)return;busy=true;
    if(RM){root();return}
    cancelAnimationFrame(raf);stage.classList.remove("rub","hov");setV("--px",0);setV("--py",0);
    flap(true);
    T.forEach((t,i)=>{t.style.zIndex=6;t.style.animation="none";const d=250+i*80;setTimeout(()=>{t.style.zIndex=3},d+620);
      t.style.transition=`transform .85s cubic-bezier(.55,-.15,.75,.3) ${d}ms, opacity .3s ${d+560}ms`;t.style.transform=toMouth(t,"scale(.08) rotate(540deg)");t.style.opacity="0"});
    setTimeout(()=>stage.classList.add("dive"),1150);
    setTimeout(()=>{const er=el.getBoundingClientRect(),pr=el.querySelector(".fz.fpaper").getBoundingClientRect();
      el.querySelectorAll(".tap-hint,.bottom").forEach(x=>x.style.visibility="hidden");
      el.style.transformOrigin=`${pr.left-er.left+pr.width/2}px ${pr.top-er.top+pr.height*.42}px`;
      el.style.willChange="transform";el.style.transition="transform .75s cubic-bezier(.55,0,.8,.2)";el.style.transform="scale(11)"},1450);
    setTimeout(()=>paintChrome("#FFFFFF"),1650);
    setTimeout(()=>{root();paintChrome("#FFFFFF");const sc=app.firstElementChild;sc.classList.remove("in");
      const w=document.createElement("div");w.className="paperwipe";document.body.appendChild(w);
      sc.classList.add("emerge");
      requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add("go")));
      setTimeout(()=>{w.remove();syncChrome()},1200)},2220);
  };
  /* 손/마우스 반응: 폴더는 기울고 문지르면 살짝 열리고, 아이콘은 건드리면 튕겨남 */
  if(RM)T.forEach(t=>t.dataset.ready=1);
  let lx=null,ly=null,moved=0,downAt=null,raf=0,inZip=false,ev=null;
  const cur={px:0,py:0,pk:0},tgt={px:0,py:0,pk:0};let SR=null,ZR=null,TC=[];
  const measure=()=>{SR=stage.getBoundingClientRect();ZR=zip.getBoundingClientRect();
    TC=T.map(t=>{const r=t.getBoundingClientRect();return {t,x:r.left+r.width/2,y:r.top+r.height/2,r:r.width*.55}})};
  const setV=(k,v)=>stage.style.setProperty(k,v);
  const poke=(t,dx,dy)=>{if(!t.dataset.ready||t.dataset.cool)return;t.dataset.cool=1;
    const l=Math.hypot(dx,dy)||1,f=RM?0:26,r=(Math.random()<.5?-1:1)*(18+Math.random()*22);
    t.classList.add("poked");t.style.transition="transform .2s cubic-bezier(.2,.8,.3,1)";t.style.transform=`translate(${dx/l*f}px,${dy/l*f}px) rotate(${r}deg) scale(1.14)`;
    try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
    setTimeout(()=>{if(busy)return;t.style.transition="transform .75s cubic-bezier(.2,.9,.3,1.5)";t.style.transform="";},220);
    setTimeout(()=>{delete t.dataset.cool;t.classList.remove("poked");if(!busy)t.style.transition=""},950)};
  /* 한 프레임에 한 번만 계산·반영 (포인터 이벤트마다 스타일을 건드리지 않음) */
  const tick=()=>{raf=0;if(busy)return;
    if(ev){const {x,y}=ev;ev=null;if(!SR)measure();
      const sp=lx==null?0:Math.hypot(x-lx,y-ly);if(downAt)moved+=sp;lx=x;ly=y;
      inZip=x>ZR.left-16&&x<ZR.right+16&&y>ZR.top-16&&y<ZR.bottom+16;
      if(inZip){tgt.px=Math.max(-1,Math.min(1,(x-ZR.left-ZR.width/2)/(ZR.width/2)));tgt.py=Math.max(-1,Math.min(1,(y-ZR.top-ZR.height/2)/(ZR.height/2)));
        if(!RM&&sp>3)tgt.pk=Math.min(30,tgt.pk+sp*.35)}else{tgt.px=0;tgt.py=0}
      for(const c of TC)if(Math.hypot(x-c.x,y-c.y)<c.r)poke(c.t,c.x-x,c.y-y)}
    tgt.pk*=.9;
    let live=false;for(const k in cur){const d=tgt[k]-cur[k];if(Math.abs(d)>.004){cur[k]+=d*.18;live=true}else cur[k]=tgt[k]}
    setV("--px",cur.px.toFixed(3));setV("--py",cur.py.toFixed(3));setV("--pk",cur.pk.toFixed(2));
    stage.classList.toggle("hov",inZip);stage.classList.toggle("rub",cur.pk>.6);
    if(live||tgt.pk>.3)raf=requestAnimationFrame(tick)};
  const kick=()=>{if(!raf)raf=requestAnimationFrame(tick)};
  stage.addEventListener("pointermove",e=>{ev={x:e.clientX,y:e.clientY};kick()},{passive:true});
  stage.addEventListener("pointerenter",()=>{SR=null});
  stage.addEventListener("pointerdown",e=>{SR=null;downAt=1;moved=0;lx=e.clientX;ly=e.clientY;ev={x:e.clientX,y:e.clientY};kick()});
  stage.addEventListener("pointerup",()=>{downAt=null});
  stage.addEventListener("pointerleave",()=>{lx=null;inZip=false;tgt.px=0;tgt.py=0;kick()});
  window.addEventListener("resize",()=>{SR=null;if(document.body.contains(stage))fitStage()},{passive:true});
  zip.onclick=()=>{if(moved>14){moved=0;return}go()};el.querySelector("#open").onclick=go;
}

function archive(cat,focusYear){
  if(cat)setCat(cat);cat=CUR;
  const list=CATS[cat].list,N=list.length,n=doneIn(cat),pct=Math.round(n/N*100);
  if(focusYear!==undefined)openYear=focusYear;
  const el=mount(`
   <div class="top"><button class="back" id="up" aria-label="상위 폴더">←</button><div class="path">먹어봤.zip / <b>${CATS[cat].name}</b> /</div></div>
   <div style="display:flex;align-items:center;gap:8px"><h2 class="h">${CATS[cat].name} 아카이브</h2></div>
   <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px">
     <span class="sub">2년 단위 폴더를 눌러 파일을 열어봐</span><span class="tag acc">${n} / ${N} 열람</span></div>
   <div class="prog"><div class="track"><div class="fill" style="width:0"></div></div><span>${pct}%</span></div>
   <div class="folders">${PERIODS.map(pr=>{const y=pr[0],isOpen=periodKey(openYear)===y;
     const fs=list.filter(f=>f.year>=pr[0]&&f.year<=pr[1]),d=fs.filter(f=>S.done[f.id]).length;
     return `<div class="folder ${isOpen?"open":""} ${d===fs.length?"done":""}" data-y="${y}">
      <button class="fhead" aria-expanded="${isOpen}" aria-label="${pr[0]===pr[1]?pr[0]+"년":pr[0]+"년부터 "+pr[1]+"년까지"}"><span class="ficon"></span><span class="yr">${periodLabel(pr)}</span>
       <span class="peek">${fs.map(f=>S.done[f.id]?ic(f.icon):`<span class="qm">?</span>`).join("")}</span>
       <span class="cnt">${d} / ${fs.length}</span></button>
      <div class="files"><div>${fs.map(f=>{const dn=S.done[f.id];return `
       <button class="file" data-id="${f.id}"><span class="fimg">${dn?ic(f.icon):"?"}</span>
        <span class="fname"><b>${dn?f.name:"아직 안 연 파일"}</b><small>${dn?f.id+"."+(cat==="food"?"food":"clip")+" · "+lab(f,dn.ate):"file_"+fileNo(f)+".???"}</small></span>
        <span class="go">${dn?"기록 보기":"열기 →"}</span></button>`}).join("")}</div></div></div>`}).join("")}</div>
   <div class="bottom"><button class="btn ${n===N?"p":"s"}" id="rcpt">영수증 보기</button></div>`,"archive");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.querySelector(".fill").style.width=pct+"%"}));
  el.querySelector("#up").onclick=root;
  el.querySelector("#rcpt").onclick=result;
  el.querySelectorAll(".folder").forEach(fd=>{
    fd.querySelector(".fhead").onclick=()=>{
      const y=+fd.dataset.y,was=fd.classList.contains("open");

    };

/* 스프링처럼 부드럽게 튀는 애니메이션: 감쇠 진동을 촘촘히 샘플링해 끝까지 속도가 자연스럽게 줄어듦 */
function springKF(fn,n=36){const k=[];for(let i=0;i<=n;i++){const t=i/n,e=Math.exp(-3.6*t)*(1-t);k.push(Object.assign({offset:t},fn(t,e)))}return k}
const KF_POP=springKF((t,e)=>{const w=Math.sin(Math.PI*2.4*t)*e;return {translate:`0 ${(-11*w).toFixed(2)}px`,scale:(1+.16*w).toFixed(3),rotate:`${(-9*Math.sin(Math.PI*3.1*t)*e).toFixed(2)}deg`}});
const KF_WIG=springKF((t,e)=>{const w=Math.sin(Math.PI*3.2*t)*Math.exp(-4*t)*(1-t);return {translate:`${(3.2*w).toFixed(2)}px 0`,rotate:`${(.5*w).toFixed(3)}deg`}});
function springPlay(x,kf,ms){if(!x||x._spr)return;if(!x.animate){return}x._spr=x.animate(kf,{duration:ms,easing:"linear"});x._spr.onfinish=x._spr.oncancel=()=>{x._spr=null}}
/* 게시판: 글 카드를 훑으면 살짝 흔들리고, 누르면 꾹 눌림 */
function boardTouch(el){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  let last=null,raf=0,ev=null;
  const pop=x=>springPlay(x,KF_WIG,620);
  const hit=()=>{raf=0;if(!ev)return;const t=document.elementFromPoint(ev.x,ev.y);ev=null;if(!t||!el.contains(t))return;const c=t.closest(".bd-post");if(c&&c!==last){last=c;pop(c)}};
  el.addEventListener("pointermove",e=>{ev={x:e.clientX,y:e.clientY};if(!raf)raf=requestAnimationFrame(hit)},{passive:true});
  el.addEventListener("pointerdown",e=>{const c=e.target.closest(".bd-post");if(c)c.classList.add("press")},{passive:true});
  ["pointerup","pointercancel","pointerleave"].forEach(n=>el.addEventListener(n,()=>{last=null;el.querySelectorAll(".bd-post.press").forEach(x=>x.classList.remove("press"))},{passive:true}));
}
/* 아카이브 화면: 마우스로 훑거나 손가락으로 문지르면 아이콘이 톡톡 튀고, 폴더가 살짝 흔들림 */
function archiveTouch(el){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const popCls=(x,cls,ms)=>{if(!x||x.dataset.cool)return;x.dataset.cool=1;x.classList.remove(cls);void x.offsetWidth;x.classList.add(cls);setTimeout(()=>{x.classList.remove(cls);delete x.dataset.cool},ms)};
  const pop=(x,cls,ms)=>cls==="pop"?springPlay(x,KF_POP,720):cls==="rub"?(springPlay(x,KF_WIG,620),popCls(x,"rub",600)):popCls(x,cls,ms);
  let lastRow=null,raf=0,ev=null;
  const hit=()=>{raf=0;if(!ev)return;const {x,y}=ev;ev=null;const t=document.elementFromPoint(x,y);if(!t||!el.contains(t))return;
    const pk=t.closest(".peek>*");if(pk){pop(pk,"pop",560);try{navigator.vibrate&&navigator.vibrate(5)}catch(e){}}

  ["pointerup","pointercancel","pointerleave"].forEach(n=>el.addEventListener(n,()=>{el.querySelectorAll(".press").forEach(x=>x.classList.remove("press"));if(n!=="pointerup")lastRow=null},{passive:true}));

/* 3. quiz */
/* 보기 고르기: 매번 새로 뽑음. 같은 분야에서 연도가 가까운 파일 위주(그럴듯한 오답) + 자주 나온 보기는 덜 나오게 */
const optSeen={};
function pickOpts(f){
  const pool=ITEMS.filter(x=>x.cat===f.cat&&x.id!==f.id);
  const score=x=>{const dy=Math.abs(x.year-f.year);return (dy===0?0:dy<=2?1:dy<=4?2.2:3.5)+(optSeen[x.id]||0)*.8+Math.random()*1.6};
  const near=pool.map(x=>[score(x),x]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);
  const pick=[near[0],near[1]];
  const far=pool.filter(x=>!pick.includes(x)&&Math.abs(x.year-f.year)>=3);
  pick.push(far.length?far[Math.floor(Math.random()*far.length)]:near[2]);
  pick.forEach(x=>optSeen[x.id]=(optSeen[x.id]||0)+1);
  return shuffle([f.id,...pick.map(x=>x.id)]);
}
const josa=(w,a,b)=>{const m=String(w).match(/[가-힣](?=[^가-힣]*$)/);if(!m)return a.replace(/./,"")?`${a}(${b})`:b;return (m[0].charCodeAt(0)-0xAC00)%28?a:b};
function quiz(f){
  setCat(f.cat);Q={f,h:0,t0:Date.now(),wrong:0};
  const el=mount(`
   <div class="top"><button class="back" id="bk" aria-label="아카이브로">←</button><div class="path">${dir(f)} / ${f.year} / file_${fileNo(f)}.???</div></div>
   <div class="bar"><i></i><i></i><i></i></div>
   <div class="hint" id="hint"><div class="big">?</div><div class="no"></div><p class="t"></p><p class="s"></p></div>
   <div class="prev-hints" id="prev"></div>
   <div class="ask">나는 누구일까?</div>
   <div class="opts">${pickOpts(f).map(id=>`<button class="opt" data-id="${id}">${byId[id].name}</button>`).join("")}</div>
   <div class="opt-fb" id="fb" role="status" aria-live="polite"></div>
   <div class="bottom" style="padding-top:4px"><button class="link" id="next"></button></div>`,"quiz");
  el.querySelector("#bk").onclick=()=>archive(f.cat,f.year);
  const draw=anim=>{
    const [t,s]=f.hints[Q.h],hint=el.querySelector("#hint");
    hint.querySelector(".no").textContent=Q.h?`HINT ${Q.h} / 2`:"QUESTION";
    hint.querySelector(".t").textContent=t;hint.querySelector(".s").textContent=s;
    if(anim){hint.classList.remove("flip");void hint.offsetWidth;hint.classList.add("flip")}
    el.querySelectorAll(".bar i").forEach((b,i)=>b.classList.toggle("on",i<=Q.h));
    el.querySelector("#prev").innerHTML=f.hints.slice(0,Q.h).map((h,i)=>`<div><b>${i?"H"+i:"Q"}</b>${h[0]}</div>`).join("");
    el.querySelector("#next").textContent=Q.h<2?`모르겠어, 힌트 ${Q.h+1} 보기 →`:"포기할래, 정답 보기";
  };
  draw(false);
  el.querySelector("#next").onclick=()=>{if(Q.h<2){Q.h++;draw(true)}else reveal(f,false)};
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("wrong"))return;
    if(b.dataset.id===f.id){b.classList.add("right");setTimeout(()=>reveal(f,true),380);return}
    b.classList.add("wrong");Q.wrong++;
    const w=byId[b.dataset.id],fb=el.querySelector("#fb");
    fb.innerHTML=`<b>✕ ${w.name}</b>${josa(w.name,"은","는")} ${w.year}년 파일이야 · ${w.desc}<span>${Q.h<2?`힌트 ${Q.h+1} 줄게`:"남은 보기 중에 다시 골라봐"}</span>`;
    fb.classList.remove("show");void fb.offsetWidth;fb.classList.add("show");
    if(Q.h<2)setTimeout(()=>{Q.h++;draw(true)},700);
  });
}

/* 4. reveal */
function reveal(f,solved){

function confetti(el){

/* 5. record */

/* 기사 스크랩 → 출처 목록에서 같은 언론사·날짜의 기사 링크 찾기 */
function headSrc(f){
  const norm=x=>String(x).toLowerCase().replace(/korea\s*joongang\s*daily/,"중앙데일리").replace(/\s|\(.*?\)|business|코리아|\.|·|,/g,"");
  const [out,date]=f.head.m.split(" · "),o=norm(out),d=(date||"").replace(/\.0?/g,".");
  const c=f.src.filter(s=>{const n=norm(s[0].split(",")[0]);return n&&(n.includes(o)||o.includes(n))});
  return c.find(s=>{const sd=(s[0].split(",")[1]||"").trim();return sd&&d.startsWith(sd.slice(0,7))})||c[0]||null;
}
function countUp(el){
  el.querySelectorAll(".stat .v").forEach(v=>{
    const full=v.dataset.v,m=full.match(/^(\D*?)(\d[\d,]*)(.*)$/);
    if(!m||/[.~:년월]/.test(full))return;
    const target=+m[2].replace(/,/g,"");if(!target)return;
    const t0=performance.now(),dur=900;
    const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);v.textContent=m[1]+Math.round(target*e)+m[3];if(p<1)requestAnimationFrame(step);else v.textContent=full};
    requestAnimationFrame(step);
  });
}

/* 6. combined receipt */
const pad2=n=>String(n).padStart(2,"0");
const fmtT=ms=>{if(ms==null)return "–";const s=Math.max(1,Math.round(ms/1000));return s<60?`${s}초`:`${Math.floor(s/60)}분 ${pad2(s%60)}초`};
const mmss=ms=>{const t=Math.max(1,Math.round(ms/1000));return `${Math.floor(t/60)}:${pad2(t%60)}`};
const fmtD=t=>{const d=new Date(t);return `${pad2(d.getMonth()+1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const fmtFull=t=>{const d=new Date(t);return `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
function stats(){
  const opened=ITEMS.filter(f=>S.done[f.id]),N=ITEMS.length;
  const solved=opened.filter(f=>S.done[f.id].solved);
  const exp={food:FOODS.filter(f=>S.done[f.id]&&S.done[f.id].ate==="y").length,culture:CULTURE.filter(f=>S.done[f.id]&&S.done[f.id].ate==="y").length};
  const timed=opened.filter(f=>S.done[f.id].ms!=null);
  const total=timed.reduce((a,f)=>a+S.done[f.id].ms,0);
  const fast=solved.filter(f=>S.done[f.id].ms!=null).sort((a,b)=>S.done[a.id].ms-S.done[b.id].ms)[0];
  const avgH=opened.length?(opened.reduce((a,f)=>a+S.done[f.id].hints-1,0)/opened.length).toFixed(1):"–";
  const r=(exp.food+exp.culture)/N;
  const rank=opened.length<N?"아직 압축 해제 중":r>=1?"유행 그 자체":r>=.75?"유행 고수":r>=.4?"유행 탐험가":"유행 관찰자";
  const no="No."+String((opened.length*7919+total)%100000).padStart(5,"0");
  /* 유행 민감도: 파일마다 경험 0.5 + 정답 0.5 → 평균 × 100. 5개 이상 열어야 표시 */
  const MIN=5,sc=f=>{const d=S.done[f.id],e=d.ate==="y"?1:d.ate==="m"?.3:0;
    const k=d.solved?Math.max(0,[1,.75,.5][Math.max(0,Math.min(2,d.hints-1))]-.1*(d.wrong||0)):0;return .5*e+.5*k};
  const sens=opened.length>=MIN?Math.round(opened.reduce((a,f)=>a+sc(f),0)/opened.length*100):null;
  const tier=sens==null?null:sens<=20?"유행 무풍지대":sens<=40?"뒤늦게 아는 편":sens<=60?"평균 한국인":sens<=80?"유행 감별사":"트렌드 레이더";
  const rank2=tier||`측정 중 (${opened.length}/${MIN})`;
  return {opened,N,solved,exp,total,fast,avgH,rank:rank2,no,sens,MIN};
}
function itemSub(f){const d=S.done[f.id];if(!d)return "아직 안 연 파일";
  return `${d.at?fmtD(d.at):"–"} · 본 힌트 ${d.hints-1}/2 · ${fmtT(d.ms)} · ${d.solved?(d.wrong?`정답(오답 ${d.wrong})`:"정답"):"포기"}`}

}

function trimSign(cv){
  try{const c=cv.getContext("2d"),W=cv.width,H=cv.height,d=c.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=0,y1=0;
    for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){if(d[(y*W+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
    if(x1<=x0||y1<=y0)return cv.toDataURL("image/png");
    const m=12,sx=Math.max(0,x0-m),sy=Math.max(0,y0-m),sw=Math.min(W,x1+m)-sx,sh=Math.min(H,y1+m)-sy;
    const o=document.createElement("canvas");o.width=sw;o.height=sh;o.getContext("2d").drawImage(cv,sx,sy,sw,sh,0,0,sw,sh);return o.toDataURL("image/png")}
  catch(e){return cv.toDataURL("image/png")}
}

  cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;last=pos(e);x.beginPath();x.arc(last.x,last.y,1.3,0,7);x.fillStyle="#111";x.fill();has=true;o.querySelector("#sgHint").hidden=true;o.querySelector("#sgErr").hidden=true});

  async comment(postId,c){const v=this._read(),p=v.posts.find(x=>x.id===postId);if(!p)throw new Error("gone");p.comments.push(c);if(!this._write(v))throw new Error("full");return p},
  async remove(postId){const v=this._read();v.posts=v.posts.filter(x=>x.id!==postId);this._write(v)},
  async removeComment(postId,cid){const v=this._read(),p=v.posts.find(x=>x.id===postId);if(!p)throw new Error("gone");p.comments=p.comments.filter(c=>c.id!==cid);this._write(v);return p}
};
const RemoteStore={
  remote:true,_sb:null,_ready:null,
  _lib(){return window.supabase?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=SB_LIB;sc.onload=ok;sc.onerror=()=>no(new Error("lib"));document.head.appendChild(sc)})},
  ensure(){ /* 처음 한 번: 라이브러리 로드 → 익명 로그인(브라우저에 유지) → myId = 서버가 준 사용자 ID */
    if(!this._ready)this._ready=(async()=>{await this._lib();
      this._sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"meogeobwat.auth"}});
      let {data}=await this._sb.auth.getSession();let user=data&&data.session&&data.session.user;
      if(!user){const r=await this._sb.auth.signInAnonymously();if(r.error)throw r.error;user=r.data.user}
      myId=user.id;return this._sb})().catch(e=>{this._ready=null;throw e});
    return this._ready},
  _map(p){return {id:p.id,author:p.author,owner:p.owner,text:p.text||"",img:p.img,kind:p.kind,at:Date.parse(p.created_at),
    comments:(p.comments||[]).map(c=>({id:c.id,author:c.author,owner:c.owner,text:c.text,at:Date.parse(c.created_at)})).sort((a,b)=>a.at-b.at)}},
  _cols:"id,author,owner,text,img,kind,created_at,comments(id,author,owner,text,created_at)",
  async count(){const sb=await this.ensure();const {count,error}=await sb.from("posts").select("id",{count:"exact",head:true});if(error)throw error;return count||0},
  async list(){const sb=await this.ensure();const {data,error}=await sb.from("posts").select(this._cols).order("created_at",{ascending:false}).limit(200);if(error)throw error;return data.map(p=>this._map(p))},
  async get(id){const sb=await this.ensure();const {data,error}=await sb.from("posts").select(this._cols).eq("id",id).maybeSingle();if(error)throw error;return data?this._map(data):null},
  async add(post){const sb=await this.ensure();const {error}=await sb.from("posts").insert({author:post.author,text:post.text||"",img:post.img,kind:post.kind});if(error)throw error},
  async comment(postId,c){const sb=await this.ensure();const {error}=await sb.from("comments").insert({post_id:postId,author:c.author,text:c.text});if(error)throw error},
  async remove(postId){const sb=await this.ensure();const {error}=await sb.from("posts").delete().eq("id",postId);if(error)throw error},
  /* 가벼운 변경 확인용: 이미지 없이 글 ID와 댓글 ID만 받아옴 */
  async sig(){const sb=await this.ensure();const {data,error}=await sb.from("posts").select("id,comments(id)").order("created_at",{ascending:false}).limit(200);if(error)throw error;return data.map(p=>p.id+":"+(p.comments||[]).length).join(",")},
  async postSig(id){const sb=await this.ensure();const {data,error}=await sb.from("posts").select("id,comments(id)").eq("id",id).maybeSingle();if(error)throw error;return data?(data.comments||[]).map(c=>c.id).sort().join(","):null},
  async removeComment(postId,cid){const sb=await this.ensure();const {error}=await sb.from("comments").delete().eq("id",cid);if(error)throw error}
};

/* ===== 화면 기록: 새로고침해도 보던 화면 유지 + 휴대폰 뒤로가기(제스처)로 이전 화면 =====
   주소 끝 #경로에 현재 화면을 적고, 화면을 옮길 때마다 브라우저 방문 기록에 한 칸씩 쌓는다. */
const NAV={stack:[],skipPop:false,popping:false};
const navUrl=r=>location.pathname+location.search+(r?"#"+r:"");
function setRoute(r,replace){
  try{
    const st=NAV.stack,top=st.length-1;
    if(NAV.popping||st[top]===r){if(st[top]!==r){st[top]=r;history.replaceState({i:top},"",navUrl(r))}return}
    if(replace){st[top]=r;history.replaceState({i:top},"",navUrl(r));return}
    if(top>=1&&st[top-1]===r){NAV.skipPop=true;st.pop();history.back();return}   /* 화면 속 ← 버튼 = 브라우저 뒤로가기와 같은 칸 */
    st.push(r);history.pushState({i:st.length-1},"",navUrl(r));
  }catch(e){}
}
(function(){
  /* 문제를 다 풀고 기록 화면으로 갈 때, 글을 올리고 게시판으로 갈 때는 기록을 덮어씀(뒤로가기 헛칸 방지) */
  const W=(name,route)=>{const f=window[name];window[name]=function(...a){const out=f.apply(this,a);try{const r=route(...a),top=NAV.stack[NAV.stack.length-1]||"";
    const rep=(name==="record"&&top===`quiz/${a[0].id}`)||(name==="board"&&top==="write");setRoute(r,rep)}catch(e){}return out}};
  W("splash",()=>"");W("root",()=>"root");
  W("archive",()=>`archive/${CUR}${openYear?"/"+periodKey(openYear):""}`);
  W("quiz",f=>`quiz/${f.id}`);W("reveal",f=>`quiz/${f.id}`);W("record",f=>`record/${f.id}`);
  W("result",()=>"result");W("board",()=>"board");W("writePost",()=>"write");W("postView",id=>`post/${id}`);
})();
function render(h,fromPop){
  const [a,b,c]=decodeURIComponent(h||"").split("/");
  try{
    if(a==="root")return root();
    if(a==="archive"&&CAT_KEYS.includes(b))return archive(b,c?+c:null);
    if((a==="quiz"||a==="record")&&byId[b])return S.done[b]?record(byId[b]):quiz(byId[b]);
    if(a==="result")return result();
    if(a==="board"||a==="write")return board();
    if(a==="post"&&b)return postView(b);
  }catch(e){}
  const cur=document.querySelector(".screen");
  return splash(!!(fromPop&&cur&&cur.id==="root"));   /* 압축 해제 화면에서 뒤로 → 줌아웃 연출 */
}
/* 바로 들어온 주소(공유 링크·새로고침)도 뒤로가기가 자연스럽게: 상위 화면들을 기록에 미리 깔아둠 */
function parentChain(h){
  const [a,b]=h.split("/");const ch=["","root"];
  if(a==="quiz"||a==="record"){const f=byId[b];if(f)ch.push(`archive/${f.cat}/${periodKey(f.year)}`)}
  if(a==="post"||a==="write")ch.push("board");
  if(a==="write")return ch.concat("board").filter((x,k,arr)=>arr.indexOf(x)===k);
  return ch;
}
window.addEventListener("popstate",e=>{
  if(NAV.skipPop){NAV.skipPop=false;return}
  const h=decodeURIComponent(location.hash.slice(1));
  const i=e.state&&typeof e.state.i==="number"?e.state.i:null;
  if(i!=null){NAV.stack.length=i;NAV.stack[i]=h}else NAV.stack.push(h);
  NAV.popping=true;try{render(h,true)}finally{NAV.popping=false}
});
function boot(){
  /* 새로고침(같은 탭)이면 보던 화면 복원, 공유 링크로 새로 열면 첫 화면부터 */
  let alive=false;try{alive=sessionStorage.getItem("meogeobwat.alive")==="1";sessionStorage.setItem("meogeobwat.alive","1")}catch(e){}
  let navType="";try{navType=(performance.getEntriesByType("navigation")[0]||{}).type||""}catch(e){}
  const restore=alive||navType==="reload"||navType==="back_forward";
  const h=restore?decodeURIComponent(location.hash.slice(1)):"";
  try{
    const chain=h&&h!=="write"?parentChain(h).filter(x=>x!==h):[];
    if(chain.length){NAV.stack=[chain[0]];history.replaceState({i:0},"",navUrl(chain[0]));
      for(const r of chain.slice(1)){NAV.stack.push(r);history.pushState({i:NAV.stack.length-1},"",navUrl(r))}
      NAV.stack.push(h);history.pushState({i:NAV.stack.length-1},"",navUrl(h))}
    else{NAV.stack=[h==="write"?"board":h];history.replaceState({i:0},"",navUrl(NAV.stack[0]))}
  }catch(e){NAV.stack=[h]}
  NAV.popping=true;try{render(h==="write"?"board":h)}finally{NAV.popping=false}
}
boot();
</script>
